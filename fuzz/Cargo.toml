[package]
name = "tq-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tq-core = { path = "../crates/tq-core" }

[[bin]]
name = "bytecode_decode"
path = "fuzz_targets/bytecode_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vm_program"
path = "fuzz_targets/vm_program.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
