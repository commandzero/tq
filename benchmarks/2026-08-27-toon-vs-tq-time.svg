<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">tq, toon, and streaming toon median conversion time</title>
  <desc id="desc">Grouped horizontal bars compare median wall-clock and CPU seconds across four JSON files. tq is fastest in every case.</desc>
  <rect width="1200" height="680" fill="#0b1020"/>
  <style>
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e6edf7; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #a9b4c7; }
    .panel { font-size: 17px; font-weight: 650; }
    .case { font-size: 13px; font-weight: 600; }
    .tick { font-size: 11px; fill: #8f9bb0; }
    .value { font-size: 11px; font-weight: 650; }
    .grid { stroke: #27324a; stroke-width: 1; }
    .axis { stroke: #52627a; stroke-width: 1.2; }
  </style>
  <text x="55" y="42" class="title">JSON to TOON conversion time</text>
  <text x="55" y="67" class="subtitle">Median of seven measured runs after one warmup. Lower is better.</text>
  <rect x="806" y="31" width="14" height="14" rx="2" fill="#24b8aa"/><text x="828" y="43" class="case">tq</text>
  <rect x="870" y="31" width="14" height="14" rx="2" fill="#4f8fd8"/><text x="892" y="43" class="case">toon</text>
  <rect x="956" y="31" width="14" height="14" rx="2" fill="#8074ba"/><text x="978" y="43" class="case">streaming toon</text>

  <text x="55" y="112" class="panel">Wall-clock time</text>
  <text x="655" y="112" class="panel">CPU time, user + system</text>

  <g>
    <line x1="150" y1="135" x2="150" y2="570" class="axis"/><line x1="150" y1="570" x2="520" y2="570" class="axis"/>
    <line x1="224" y1="135" x2="224" y2="570" class="grid"/><line x1="298" y1="135" x2="298" y2="570" class="grid"/><line x1="372" y1="135" x2="372" y2="570" class="grid"/><line x1="446" y1="135" x2="446" y2="570" class="grid"/><line x1="520" y1="135" x2="520" y2="570" class="grid"/>
    <text x="150" y="591" text-anchor="middle" class="tick">0</text><text x="224" y="591" text-anchor="middle" class="tick">0.5</text><text x="298" y="591" text-anchor="middle" class="tick">1.0</text><text x="372" y="591" text-anchor="middle" class="tick">1.5</text><text x="446" y="591" text-anchor="middle" class="tick">2.0</text><text x="520" y="591" text-anchor="middle" class="tick">2.5 s</text>

    <text x="135" y="183" text-anchor="end" class="case">indices</text>
    <rect x="150" y="148" width="19.2" height="16" rx="3" fill="#24b8aa"/><text x="175" y="160" class="value">0.13</text>
    <rect x="150" y="170" width="28.1" height="16" rx="3" fill="#4f8fd8"/><text x="184" y="182" class="value">0.19</text>
    <rect x="150" y="192" width="31.1" height="16" rx="3" fill="#8074ba"/><text x="187" y="204" class="value">0.21</text>

    <text x="135" y="283" text-anchor="end" class="case">segments</text>
    <rect x="150" y="248" width="115.4" height="16" rx="3" fill="#24b8aa"/><text x="271" y="260" class="value">0.78</text>
    <rect x="150" y="270" width="336.0" height="16" rx="3" fill="#4f8fd8"/><text x="492" y="282" class="value">2.27</text>
    <rect x="150" y="292" width="266.4" height="16" rx="3" fill="#8074ba"/><text x="422" y="304" class="value">1.80</text>

    <text x="135" y="383" text-anchor="end" class="case">recovery</text>
    <rect x="150" y="348" width="182.0" height="16" rx="3" fill="#24b8aa"/><text x="338" y="360" class="value">1.23</text>
    <rect x="150" y="370" width="315.2" height="16" rx="3" fill="#4f8fd8"/><text x="471" y="382" class="value">2.13</text>
    <rect x="150" y="392" width="232.4" height="16" rx="3" fill="#8074ba"/><text x="388" y="404" class="value">1.57</text>

    <text x="135" y="483" text-anchor="end" class="case">snapshot</text>
    <rect x="150" y="448" width="71.0" height="16" rx="3" fill="#24b8aa"/><text x="227" y="460" class="value">0.48</text>
    <rect x="150" y="470" width="146.5" height="16" rx="3" fill="#4f8fd8"/><text x="303" y="482" class="value">0.99</text>
    <rect x="150" y="492" width="219.0" height="16" rx="3" fill="#8074ba"/><text x="375" y="504" class="value">1.48</text>
  </g>

  <g>
    <line x1="750" y1="135" x2="750" y2="570" class="axis"/><line x1="750" y1="570" x2="1120" y2="570" class="axis"/>
    <line x1="824" y1="135" x2="824" y2="570" class="grid"/><line x1="898" y1="135" x2="898" y2="570" class="grid"/><line x1="972" y1="135" x2="972" y2="570" class="grid"/><line x1="1046" y1="135" x2="1046" y2="570" class="grid"/><line x1="1120" y1="135" x2="1120" y2="570" class="grid"/>
    <text x="750" y="591" text-anchor="middle" class="tick">0</text><text x="824" y="591" text-anchor="middle" class="tick">0.5</text><text x="898" y="591" text-anchor="middle" class="tick">1.0</text><text x="972" y="591" text-anchor="middle" class="tick">1.5</text><text x="1046" y="591" text-anchor="middle" class="tick">2.0</text><text x="1120" y="591" text-anchor="middle" class="tick">2.5 s</text>

    <text x="735" y="183" text-anchor="end" class="case">indices</text>
    <rect x="750" y="148" width="17.8" height="16" rx="3" fill="#24b8aa"/><text x="774" y="160" class="value">0.12</text>
    <rect x="750" y="170" width="26.6" height="16" rx="3" fill="#4f8fd8"/><text x="783" y="182" class="value">0.18</text>
    <rect x="750" y="192" width="29.6" height="16" rx="3" fill="#8074ba"/><text x="786" y="204" class="value">0.20</text>

    <text x="735" y="283" text-anchor="end" class="case">segments</text>
    <rect x="750" y="248" width="112.5" height="16" rx="3" fill="#24b8aa"/><text x="869" y="260" class="value">0.76</text>
    <rect x="750" y="270" width="333.0" height="16" rx="3" fill="#4f8fd8"/><text x="1089" y="282" class="value">2.25</text>
    <rect x="750" y="292" width="264.9" height="16" rx="3" fill="#8074ba"/><text x="1021" y="304" class="value">1.79</text>

    <text x="735" y="383" text-anchor="end" class="case">recovery</text>
    <rect x="750" y="348" width="179.1" height="16" rx="3" fill="#24b8aa"/><text x="935" y="360" class="value">1.21</text>
    <rect x="750" y="370" width="313.8" height="16" rx="3" fill="#4f8fd8"/><text x="1069" y="382" class="value">2.12</text>
    <rect x="750" y="392" width="232.4" height="16" rx="3" fill="#8074ba"/><text x="988" y="404" class="value">1.57</text>

    <text x="735" y="483" text-anchor="end" class="case">snapshot</text>
    <rect x="750" y="448" width="69.6" height="16" rx="3" fill="#24b8aa"/><text x="826" y="460" class="value">0.47</text>
    <rect x="750" y="470" width="145.0" height="16" rx="3" fill="#4f8fd8"/><text x="901" y="482" class="value">0.98</text>
    <rect x="750" y="492" width="216.1" height="16" rx="3" fill="#8074ba"/><text x="972" y="504" class="value">1.46</text>
  </g>
  <text x="55" y="648" class="subtitle">CPU time is user + system from /usr/bin/time -l. Values are seconds.</text>
</svg>
