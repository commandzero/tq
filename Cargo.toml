[workspace]
members = [
    "crates/tq-cli",
    "crates/tq-core",
    "crates/tq-formats",
    "crates/tq-test-support",
    "crates/tq-toon",
]
default-members = ["crates/tq-cli"]
exclude = ["tests/fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "A jq-compatible query CLI for TOON, YAML, JSON, and JSON Lines"
homepage = "https://github.com/commandzero/tq"
repository = "https://github.com/commandzero/tq"
keywords = ["jq", "json", "yaml", "toon", "cli"]
categories = ["command-line-utilities", "encoding", "parsing"]

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.bench]
debug = "line-tables-only"

[profile.dev]
debug = "line-tables-only"
