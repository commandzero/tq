[workspace]
resolver = "2"

[package]
name = "tq-dependency-feasibility-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fancy-regex = "=0.19.1"
libm = "=0.2.16"
onig = { version = "=6.5.3", default-features = false }
regex-automata = { version = "=0.4.18", default-features = false, features = [
    "alloc",
    "syntax",
    "meta",
    "nfa",
    "dfa-onepass",
    "dfa-search",
    "hybrid",
    "std",
] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sha2 = "0.11.0"
