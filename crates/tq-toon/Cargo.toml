[package]
name = "tq-toon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TOON encoding and decoding support for tq"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
include = ["src/**", "tests/**", "LICENSE", "../../README.md"]

[dependencies]
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "preserve_order"] }
thiserror = "2.0.20"
tq-core = { version = "0.4.0", path = "../tq-core" }

[lints]
workspace = true

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.27.0"
toon-format = { version = "=0.5.0", default-features = false }

[[bench]]
name = "event_stream"
harness = false
