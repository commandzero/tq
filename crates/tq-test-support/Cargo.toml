[package]
name = "tq-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
toon-format = { version = "0.5.0", default-features = false }
yaml_serde = "0.10.4"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

[dev-dependencies]
jsonschema = { version = "0.49.2", default-features = false }
