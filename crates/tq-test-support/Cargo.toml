[package]
name = "tq-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
nix = { version = "0.31.3", features = ["poll", "process", "signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.11.0"
signal-hook = "0.3.18"
tempfile = "3.27.0"
thiserror = "2.0.21"
tiktoken-rs = "0.12.1"
toon-format = { version = "=0.6.0", default-features = false }
tq-cli = { path = "../tq-cli", default-features = false }
tq-core = { path = "../tq-core" }
tq-formats = { path = "../tq-formats" }
tq-toon = { path = "../tq-toon" }
wait-timeout = "0.2.1"
yaml_serde = "0.10.7"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }
wait4 = "=0.2.0"

[target.'cfg(windows)'.dependencies]
winsafe = { version = "=0.0.29", features = ["kernel", "psapi"] }
win32job = "=2.0.3"
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }
tokio = { version = "1", features = ["rt", "process", "io-util", "macros", "time", "net"] }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "=0.14.11"

[lints]
workspace = true

[dev-dependencies]
jsonschema = { version = "0.56.0", default-features = false }
