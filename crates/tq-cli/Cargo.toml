[package]
name = "tq-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
# The compatibility report is embedded in the published CLI package.
readme = "../../README.md"
include = ["src/**", "tests/**", "LICENSE", "../../README.md"]

[[bin]]
name = "tq"
path = "src/main.rs"

[lib]
name = "tq_cli"
path = "src/lib.rs"

[dependencies]
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "preserve_order"] }
signal-hook = "0.4.4"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tq-core = { version = "0.4.0", path = "../tq-core" }
tq-formats = { version = "0.4.0", path = "../tq-formats" }
tq-toon = { version = "0.4.0", path = "../tq-toon" }

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3.27.0"
tq-test-support = { path = "../tq-test-support" }

[lints]
workspace = true

[[bench]]
name = "event_stream"
harness = false
