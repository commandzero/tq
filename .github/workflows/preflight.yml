name: Repository preflight

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Repository preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Cache Rust dependencies and validator
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: preflight-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/tool-versions.sh') }}
      - name: Install validation tools
        run: |
          source scripts/tool-versions.sh
          rustup show active-toolchain
          export PATH="$PWD/target/tools/bin:$PATH"
          echo "$PWD/target/tools/bin" >> "$GITHUB_PATH"
          if ! command -v okf || [[ $(okf --version) != "okf $OKF_VERSION "* ]]; then
            cargo install okf --version "$OKF_VERSION" --locked --root target/tools
          fi
          npm install --global "@fission-ai/openspec@$OPENSPEC_VERSION"
          GOBIN="$PWD/target/tools/bin" go install "github.com/rhysd/actionlint/cmd/actionlint@v$ACTIONLINT_VERSION"
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Select checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mode=code
          if [[ -n "$BASE_SHA" ]]; then
            mode=$(./scripts/repo-check.sh scope "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Run shared preflight
        env:
          CHECK_MODE: ${{ steps.scope.outputs.mode }}
        run: |
          if [[ "$CHECK_MODE" == docs ]]; then
            ./scripts/preflight.sh --docs
          else
            ./scripts/preflight.sh
          fi
      - name: Check PR OpenSpec completion
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/check-openspec.sh "$BASE_SHA" "$HEAD_SHA"
      - name: Check minimum supported Rust
        if: steps.scope.outputs.mode != 'docs'
        run: |
          rustup toolchain install 1.87.0 --profile minimal
          rustup run 1.87.0 cargo check --workspace --exclude tq-test-support --lib --bins --locked
          rustup toolchain install 1.88.0 --profile minimal
          rustup run 1.88.0 cargo check --workspace --all-targets --locked
