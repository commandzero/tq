name: Release candidate checks

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed v-prefixed tag to validate before publication
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-contract:
    uses: ./.github/workflows/regex-date-platform.yml
    with:
      tag: ${{ inputs.tag }}
  native:
    name: Native release / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false
      - name: Install validation tools
        run: |
          command -v go >/dev/null || { echo "Release preflight requires Go to install actionlint." >&2; exit 1; }
          source scripts/tools-versions.sh
          # Keep the reviewed compiler even when recovering an older tag's tooling.
          toolchain=1.99.0
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt --component llvm-tools-preview
          toolchain_bin=$(dirname "$(rustup which --toolchain "$toolchain" cargo)")
          export PATH="$toolchain_bin:$PATH"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          rustc -vV
          cargo install okf --version "$OKF_VERSION" --locked
          npm install --global "@fission-ai/openspec@$OPENSPEC_VERSION"
          GOBIN="$PWD/target/tools/bin" go install "github.com/rhysd/actionlint/cmd/actionlint@v$ACTIONLINT_VERSION"
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install shellcheck ripgrep
          else
            sudo apt-get update
            sudo apt-get install --yes shellcheck ripgrep
          fi
      - name: Build and smoke-test native archive
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./scripts/release-package.sh "$RELEASE_TAG"
      - name: Retain verified archives for release review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.os }}
          path: target/release-artifacts/*
          if-no-files-found: error
