name: Release candidate checks

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed v-prefixed tag to validate before publication
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-contract:
    uses: ./.github/workflows/regex-date-platform.yml
    with:
      tag: ${{ inputs.tag }}
  native:
    name: Native release / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install validation tools
        run: |
          source scripts/tools-versions.sh
          toolchain=$(awk -F '"' '/^channel =/ {print $2}' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component clippy --component rustfmt
          rustup show active-toolchain
          cargo install okf --version "$OKF_VERSION" --locked
          npm install --global "@fission-ai/openspec@$OPENSPEC_VERSION"
          GOBIN="$PWD/target/tools/bin" go install "github.com/rhysd/actionlint/cmd/actionlint@v$ACTIONLINT_VERSION"
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install shellcheck ripgrep
          else
            sudo apt-get update
            sudo apt-get install --yes shellcheck ripgrep
          fi
      - name: Build and smoke-test native archive
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./scripts/release-package.sh "$RELEASE_TAG"
      - name: Retain verified archives for release review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.os }}
          path: target/release-artifacts/*
          if-no-files-found: error
